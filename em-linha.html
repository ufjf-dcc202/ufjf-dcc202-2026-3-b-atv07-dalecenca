<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Em Linha</title>
</head>

<body>
    <main>
        <h1>DCC202 <code>CSS</code> Em <u style="color: darkorange;">_Linha_</u></h1>
        <p>Você pode aplicar um Estilo em <u style="color: darkorange;">_linha_</u> para um elemento usando o atributo
            <code style="color: rebeccapurple; font-family: sans-serif; font-size: xx-large;">style</code></p>
        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Cor de Texto do elemento</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de Fundo do elemento</dd>
            </div>
        </dl>
    </main>
</body>

</html>
