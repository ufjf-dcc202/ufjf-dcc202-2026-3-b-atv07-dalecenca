<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Em Butido</title>
    <style>
        u {
            color: darkorange;
        }
        code {
            color: rebeccapurple;
            font-family: sans-serif;
            font-size: xx-large;
        }
        body > main > p > u {
            background-color: brown;
            font-size: xx-large;
        }
        
    </style>
</head>
<body>
    <main>
        <h1>DCC202 <code>CSS</code> Em <u>_Butido_</u></h1> <!-- eu sei que é embutido junto kkk -->
        <p>Você pode aplicar um Estilo em <u>_butido_</u> para um elemento usando o atributo <code>style</code></p>
        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Cor de Texto do elemento</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de Fundo do elemento</dd>
            </div>
            <div>
                <p style="font-size: xx-small;">aqui nos dale, se tu nao dale, dalecenca</p>
            </div>
        </dl>
    </main>
</body>
</html>
